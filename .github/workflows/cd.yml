name: CommuteNest CD (Optional Continuous Deployment)

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Deploy Web Frontend to S3 and Invalidate CloudFront"
        required: true
        type: boolean
        default: true
      deploy_lambdas:
        description: "Update Lambda Function Code in AWS"
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy to AWS
    runs-on: ubuntu-latest
    # To enable automated deployment:
    # 1. Create an AWS IAM Role configured with GitHub OIDC trust for this repository.
    # 2. Add AWS_ROLE_TO_ASSUME (e.g. arn:aws:iam::852824353718:role/github-actions-deploy-role) to GitHub Repository Secrets.
    # 3. Add AWS_REGION (us-east-1) to GitHub Repository Secrets or Variables.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build All Artifacts
        run: npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy Web Frontend to S3
        if: ${{ inputs.deploy_frontend }}
        env:
          S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET || 'commutenest-dev-frontend-852824353718' }}
          CLOUDFRONT_DIST_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || 'E22KXGKTJ51A6A' }}
        run: |
          aws s3 sync services/web-frontend/dist s3://$S3_BUCKET/ --delete
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/*"

      - name: Update Lambda Code
        if: ${{ inputs.deploy_lambdas }}
        run: |
          aws lambda update-function-code \
            --function-name commutenest-dev-ingestion-worker \
            --zip-file fileb://services/ingestion-worker/dist/lambda.zip
          aws lambda update-function-code \
            --function-name commutenest-dev-preferences-api \
            --zip-file fileb://services/preferences-api/dist/lambda.zip
